<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingame Replay Viewer: emulator page</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
      }
      #screen {
        display: block;
        width: min(720px, 100%);
        aspect-ratio: 3 / 2;
        image-rendering: pixelated;
        background: #000;
      }
    </style>
  </head>
  <body>
    <h1>Ingame Replay Viewer: emulator page</h1>
    <p>
      This page runs the game in the mGBA emulator, the fallback for the <a href="./">viewer</a>.
    </p>
    <div id="environment" hidden>
      <p id="environment-line"></p>
      <p>
        <a id="environment-report" target="_blank" rel="noopener" hidden>Report this problem</a>
      </p>
      <details>
        <summary>Details</summary>
        <p id="environment-detail"></p>
      </details>
    </div>
    <div id="app">
      <p>
        <label for="dump">Your US Emerald (stays in this tab)</label>
        <input id="dump" type="file" />
      </p>
      <p>
        <label for="test-replay">Example replay</label>
        <select id="test-replay"></select>
      </p>
      <form id="replay-form">
        <label for="replay-input">Replay link or ID</label>
        <input id="replay-input" type="text" placeholder="smogtours-gen3ou-994052" />
        <button type="submit">Load</button>
      </form>
      <p>
        <button id="start" type="button">Start</button>
        <button id="restart" type="button" disabled>Restart</button>
      </p>
      <p id="status" role="status"></p>
      <p><a id="report" target="_blank" rel="noopener" hidden>Report this problem</a></p>
      <details id="details">
        <summary>Details</summary>
        <p id="status-detail"></p>
      </details>
      <canvas id="screen" width="240" height="160"></canvas>
      <p id="replay-summary"></p>
      <h2 id="not-shown">Not shown in the game (0)</h2>
      <ul id="not-shown-counts"></ul>
      <ol id="not-shown-rows"></ol>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
