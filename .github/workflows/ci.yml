name: CI

on:
  push:
    branches: [master, 'wave/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: Lint, types, format, knip, unit specs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: deps
        run: npm ci
      - name: Fetch EmulatorJS's pinned packages for the manifest's spec
        run: node scripts/gen5-fetch.ts
        timeout-minutes: 2
      - name: Fetch pokebw2 at its pin and generate its numbers
        run: node scripts/gen5-bw2.ts --quiet
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: '0'
      - name: Make clang and wasm-ld available for the WebAssembly divide spec
        run: |
          command -v clang || extra=clang
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends lld $extra
        timeout-minutes: 2
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check
